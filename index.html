<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>
    
    <style>
        /* Estilização para organizar os cards dos apps na página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1.titulo-principal {
            text-align: center;
            color: #1a252f;
            margin-bottom: 30px;
        }

        .card-site {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card-site h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-top: 0;
        }

        .card-site img {
            max-width: 100%;
            height: auto;
            max-height: 200px;
            border-radius: 6px;
            margin: 15px 0;
            border: 1px solid #eee;
        }

        .card-site a {
            display: inline-block;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .card-site a:hover {
            text-decoration: underline;
            color: #1d6fa5;
        }
    </style>
</head>
<body>

    <!-- Título principal no corpo da página -->
    <h1 class="titulo-principal">Meus sites favoritos: Nilton</h1>

    <!-- App 1: TikTok -->
    <div class="card-site">
        <!-- Nome do site com tag h1 -->
        <h1>TikTok</h1>
        <!-- Imagem local do TikTok -->
        <img src="tiktok.png" alt="Logotipo do TikTok">
        <br>
        <!-- Link para o site -->
        <a href="https://www.tiktok.com" target="_blank">Acessar o TikTok</a>
    </div>

    <!-- App 2: Instagram -->
    <div class="card-site">
        <!-- Nome do site com tag h1 -->
        <h1>Instagram</h1>
        <!-- Imagem local do Instagram -->
        <img src="instagram.png" alt="Logotipo do Instagram">
        <br>
        <!-- Link para o site -->
        <a href="https://www.instagram.com" target="_blank">Acessar o Instagram</a>
    </div>

    <!-- App 3: Netflix -->
    <div class="card-site">
        <!-- Nome do site com tag h1 -->
        <h1>Netflix</h1>
        <!-- Imagem local da Netflix -->
        <img src="netflix.png" alt="Logotipo da Netflix">
        <br>
        <!-- Link para o site -->
        <a href="https://www.netflix.com" target="_blank">Acessar a Netflix</a>
    </div>

    <!-- App 4: Spotify -->
    <div class="card-site">
        <!-- Nome do site com tag h1 -->
        <h1>Spotify</h1>
        <!-- Imagem local do Spotify -->
        <img src="spotify.png" alt="Logotipo do Spotify">
        <br>
        <!-- Link para o site -->
        <a href="https://open.spotify.com" target="_blank">Acessar o Spotify</a>
    </div>

    <!-- App 5: SofaScore -->
    <div class="card-site">
        <!-- Nome do site com tag h1 -->
        <h1>SofaScore</h1>
        <!-- Imagem local do SofaScore -->
        <img src="sofascore.png" alt="Logotipo do SofaScore">
        <br>
        <!-- Link para o site -->
        <a href="https://www.sofascore.com" target="_blank">Acessar o SofaScore</a>
    </div>

</body>
</html>
